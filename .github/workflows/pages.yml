name: Build & Deploy Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release tag
        id: tag
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "main")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate index.html
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site
          jsdelivr="https://cdn.jsdelivr.net/gh/${REPO}@${TAG}/sample.json"
          release="https://github.com/${REPO}/releases/download/${TAG}/sample.json"
          raw="https://raw.githubusercontent.com/${REPO}/main/sample.json"
          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>sample.json links</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
              li { margin: 0.5rem 0; }
              code { background: #eee; padding: 0.1rem 0.3rem; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>sample.json</h1>
            <p>Generated for tag <code>${TAG}</code> by GitHub Actions.</p>
            <ul>
              <li><a href="${jsdelivr}">jsDelivr</a> — application/json + CORS</li>
              <li><a href="${release}">Release asset</a> — application/octet-stream</li>
              <li><a href="${raw}">raw.githubusercontent.com</a> — text/plain</li>
            </ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
