name: Build & Deploy Pages

on:
  push:
    branches: [main]
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all release assets into _site/<tag>/
        run: |
          mkdir -p _site
          gh release list --json tagName -q '.[].tagName' --limit 100 | while read -r tag; do
            [ -z "$tag" ] && continue
            mkdir -p "_site/${tag}"
            gh release download "$tag" --dir "_site/${tag}" 2>/dev/null || true
          done

      - name: Generate index.html
        run: |
          mime_for() {
            case "$(echo "${1##*.}" | tr '[:upper:]' '[:lower:]')" in
              json)         echo "application/json" ;;
              js|mjs)       echo "application/javascript" ;;
              css)          echo "text/css" ;;
              html|htm)     echo "text/html" ;;
              svg)          echo "image/svg+xml" ;;
              xml)          echo "application/xml" ;;
              txt)          echo "text/plain" ;;
              md|markdown)  echo "text/markdown" ;;
              yaml|yml)     echo "application/yaml" ;;
              toml)         echo "application/toml" ;;
              csv)          echo "text/csv" ;;
              png)          echo "image/png" ;;
              jpg|jpeg)     echo "image/jpeg" ;;
              gif)          echo "image/gif" ;;
              webp)         echo "image/webp" ;;
              ico)          echo "image/x-icon" ;;
              zip)          echo "application/zip" ;;
              tar)          echo "application/x-tar" ;;
              gz)           echo "application/gzip" ;;
              pdf)          echo "application/pdf" ;;
              wasm)         echo "application/wasm" ;;
              woff)         echo "font/woff" ;;
              woff2)        echo "font/woff2" ;;
              ttf)          echo "font/ttf" ;;
              otf)          echo "font/otf" ;;
              *)            echo "application/octet-stream" ;;
            esac
          }

          bytes_human() {
            b=$1
            if   [ "$b" -ge 1073741824 ]; then awk "BEGIN{printf \"%.1f GB\", $b/1073741824}"
            elif [ "$b" -ge 1048576 ];    then awk "BEGIN{printf \"%.1f MB\", $b/1048576}"
            elif [ "$b" -ge 1024 ];       then awk "BEGIN{printf \"%.1f KB\", $b/1024}"
            else echo "${b} B"; fi
          }

          {
            cat <<'HEAD'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Release files</title>
            <style>
              :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #1f2328;
                --muted: #59636e;
                --border: #d1d9e0;
                --card: #f6f8fa;
                --chip-bg: #eaeef2;
                --chip-hover: #dde3ea;
                --link: #0969da;
                --latest: #1a7f37;
                --code-bg: #eaeef2;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --bg: #0d1117;
                  --fg: #e6edf3;
                  --muted: #9198a1;
                  --border: #30363d;
                  --card: #151b23;
                  --chip-bg: #212830;
                  --chip-hover: #2a313c;
                  --link: #4493f8;
                  --latest: #3fb950;
                  --code-bg: #212830;
                }
              }
              * { box-sizing: border-box; }
              body {
                background: var(--bg); color: var(--fg);
                font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                max-width: 880px; margin: 0 auto; padding: 2.5rem 1rem 4rem;
              }
              h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
              h2 { font-size: 1.05rem; margin: 0; letter-spacing: -0.005em; }
              .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
              code {
                background: var(--code-bg); padding: 0.1rem 0.4rem; border-radius: 4px;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.875em;
              }
              a { color: var(--link); text-decoration: none; }
              a:hover { text-decoration: underline; }
              .release {
                background: var(--card); border: 1px solid var(--border);
                border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0;
              }
              .release-head {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem;
              }
              .release-meta { color: var(--muted); font-size: 0.825rem; margin-bottom: 0.75rem; }
              .latest-badge {
                display: inline-block; color: var(--latest); border: 1px solid currentColor;
                font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
                letter-spacing: 0.5px; padding: 0.1rem 0.5rem; border-radius: 999px;
              }
              .file {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1rem; padding: 0.65rem 0; border-top: 1px solid var(--border);
              }
              .file:first-of-type { border-top: none; padding-top: 0.25rem; }
              .file-main { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; flex: 1; }
              .filename {
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 0.925rem; font-weight: 600; word-break: break-all;
              }
              .file-meta {
                color: var(--muted); font-size: 0.78rem;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
              }
              .file a.open {
                display: inline-flex; align-items: center; gap: 0.4rem;
                background: var(--chip-bg); color: var(--link);
                padding: 0.35rem 0.75rem; border-radius: 6px;
                font-size: 0.825rem; font-weight: 600; white-space: nowrap;
              }
              .file a.open:hover { background: var(--chip-hover); text-decoration: none; }
              .empty { color: var(--muted); font-style: italic; }
            </style>
          </head>
          <body>
          HEAD

            echo "<h1>Release files for ${REPO}</h1>"
            echo "<p class='subtitle'>Generated $(date -u +'%Y-%m-%d %H:%M UTC') by GitHub Actions. Files are served by GitHub Pages with their native MIME types.</p>"

            releases=$(gh release list --json tagName,name,publishedAt,isLatest --limit 100)
            count=$(echo "$releases" | jq 'length')

            if [ "$count" = "0" ]; then
              echo "<p class='empty'>No releases yet.</p>"
            else
              echo "$releases" | jq -c '.[]' | while read -r release; do
                tag=$(echo "$release"     | jq -r '.tagName')
                name=$(echo "$release"    | jq -r '.name // .tagName')
                pub=$(echo "$release"     | jq -r '.publishedAt')
                latest=$(echo "$release"  | jq -r '.isLatest')
                pub_short=$(date -u -d "$pub" +'%Y-%m-%d %H:%M UTC' 2>/dev/null || echo "$pub")

                echo "<section class='release'>"
                echo "  <div class='release-head'>"
                echo "    <h2>${name}</h2>"
                [ "$latest" = "true" ] && echo "    <span class='latest-badge'>latest</span>"
                echo "  </div>"
                echo "  <div class='release-meta'>Tag <code>${tag}</code> · ${pub_short}</div>"

                if [ ! -d "_site/${tag}" ] || [ -z "$(ls -A "_site/${tag}" 2>/dev/null)" ]; then
                  echo "  <p class='empty'>No assets.</p>"
                else
                  for path in "_site/${tag}"/*; do
                    [ -f "$path" ] || continue
                    asset=$(basename "$path")
                    size=$(stat -c%s "$path")
                    mime=$(mime_for "$asset")
                    human=$(bytes_human "$size")

                    echo "  <div class='file'>"
                    echo "    <div class='file-main'>"
                    echo "      <div class='filename'>${asset}</div>"
                    echo "      <div class='file-meta'>${mime} · ${human}</div>"
                    echo "    </div>"
                    echo "    <a class='open' href='./${tag}/${asset}' target='_blank' rel='noopener'>open &rarr;</a>"
                    echo "  </div>"
                  done
                fi

                echo "</section>"
              done
            fi

            echo "</body></html>"
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set unique GITHUB_SHA for deploy
        run: |
          unique=$(printf '%s-%s-%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -d' ' -f1)
          echo "GITHUB_SHA=$unique" >> "$GITHUB_ENV"
          echo "deploy will use build version: $unique"
      - id: deployment
        uses: actions/deploy-pages@v5
