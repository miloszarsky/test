name: Build & Deploy Pages

on:
  push:
    branches: [main]
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Release-triggered runs deploy from the tag ref, which Pages frequently
  # marks "success" but doesn't actually promote. Redirect to a workflow_dispatch
  # on main, which deploys reliably.
  redirect-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy from main
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate site (wrappers + index)
        run: |
          mkdir -p _site

          mime_for() {
            case "$(echo "${1##*.}" | tr '[:upper:]' '[:lower:]')" in
              json)         echo "application/json" ;;
              js|mjs)       echo "application/javascript" ;;
              css)          echo "text/css" ;;
              html|htm)     echo "text/html" ;;
              svg)          echo "image/svg+xml" ;;
              xml)          echo "application/xml" ;;
              txt)          echo "text/plain" ;;
              md|markdown)  echo "text/markdown" ;;
              yaml|yml)     echo "application/yaml" ;;
              toml)         echo "application/toml" ;;
              csv)          echo "text/csv" ;;
              png)          echo "image/png" ;;
              jpg|jpeg)     echo "image/jpeg" ;;
              gif)          echo "image/gif" ;;
              webp)         echo "image/webp" ;;
              avif)         echo "image/avif" ;;
              ico)          echo "image/x-icon" ;;
              bmp)          echo "image/bmp" ;;
              mp4|m4v)      echo "video/mp4" ;;
              webm)         echo "video/webm" ;;
              mov)          echo "video/quicktime" ;;
              ogv)          echo "video/ogg" ;;
              mp3)          echo "audio/mpeg" ;;
              wav)          echo "audio/wav" ;;
              ogg|opus)     echo "audio/ogg" ;;
              m4a)          echo "audio/mp4" ;;
              flac)         echo "audio/flac" ;;
              zip)          echo "application/zip" ;;
              tar)          echo "application/x-tar" ;;
              gz)           echo "application/gzip" ;;
              pdf)          echo "application/pdf" ;;
              wasm)         echo "application/wasm" ;;
              woff)         echo "font/woff" ;;
              woff2)        echo "font/woff2" ;;
              ttf)          echo "font/ttf" ;;
              otf)          echo "font/otf" ;;
              *)            echo "application/octet-stream" ;;
            esac
          }

          category_for() {
            case "$(echo "${1##*.}" | tr '[:upper:]' '[:lower:]')" in
              jpg|jpeg|png|gif|webp|svg|ico|bmp|avif) echo "image" ;;
              mp4|webm|mov|ogv|m4v)                   echo "video" ;;
              mp3|wav|ogg|m4a|flac|opus)              echo "audio" ;;
              pdf)                                     echo "pdf" ;;
              *)                                       echo "other" ;;
            esac
          }

          write_wrapper() {
            local tag="$1" asset="$2" url="$3" cat="$4" mime="$5"
            mkdir -p "_site/${tag}"
            local embed
            case "$cat" in
              image) embed="<img src=\"${url}\" alt=\"${asset}\">" ;;
              video) embed="<video controls autoplay playsinline src=\"${url}\"></video>" ;;
              audio) embed="<audio controls autoplay src=\"${url}\"></audio>" ;;
              pdf)   embed="<iframe src=\"${url}\" title=\"${asset}\"></iframe>" ;;
            esac
            cat > "_site/${tag}/${asset}.html" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${asset}</title>
            <style>
              :root { color-scheme: dark light }
              html, body { margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
                font-family: system-ui, sans-serif; min-height: 100vh;
                display: flex; align-items: center; justify-content: center; }
              img, video, audio { max-width: 100%; max-height: 100vh; display: block; }
              iframe { width: 100vw; height: 100vh; border: 0; }
              .hint { position: fixed; top: .6rem; right: .6rem; font-size: .75rem;
                background: rgba(33,40,48,.85); padding: .35rem .6rem;
                border-radius: 6px; backdrop-filter: blur(6px); }
              .hint a { color: #4493f8; text-decoration: none; }
              .hint a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
          ${embed}
          <div class="hint"><a href="${url}" download>download &darr;</a></div>
          </body>
          </html>
          HTML
          }

          {
            cat <<'HEAD'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Release files</title>
            <style>
              :root {
                color-scheme: light dark;
                --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
                --border: #d1d9e0; --card: #f6f8fa;
                --chip-bg: #eaeef2; --chip-hover: #dde3ea;
                --link: #0969da; --latest: #1a7f37; --code-bg: #eaeef2;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
                  --border: #30363d; --card: #151b23;
                  --chip-bg: #212830; --chip-hover: #2a313c;
                  --link: #4493f8; --latest: #3fb950; --code-bg: #212830;
                }
              }
              * { box-sizing: border-box; }
              body {
                background: var(--bg); color: var(--fg);
                font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                max-width: 880px; margin: 0 auto; padding: 2.5rem 1rem 4rem;
              }
              h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
              h2 { font-size: 1.05rem; margin: 0; letter-spacing: -0.005em; }
              .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
              code {
                background: var(--code-bg); padding: 0.1rem 0.4rem; border-radius: 4px;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.875em;
              }
              a { color: var(--link); text-decoration: none; }
              a:hover { text-decoration: underline; }
              .release {
                background: var(--card); border: 1px solid var(--border);
                border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0;
              }
              .release-head {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem;
              }
              .release-meta { color: var(--muted); font-size: 0.825rem; margin-bottom: 0.75rem; }
              .latest-badge {
                display: inline-block; color: var(--latest); border: 1px solid currentColor;
                font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
                letter-spacing: 0.5px; padding: 0.1rem 0.5rem; border-radius: 999px;
              }
              .file {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1rem; padding: 0.65rem 0; border-top: 1px solid var(--border);
              }
              .file:first-of-type { border-top: none; padding-top: 0.25rem; }
              .file-main { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; flex: 1; }
              .filename {
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 0.925rem; font-weight: 600; word-break: break-all;
              }
              .file-meta {
                color: var(--muted); font-size: 0.78rem;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
              }
              .action {
                display: inline-flex; align-items: center; gap: 0.4rem;
                background: var(--chip-bg); color: var(--link);
                padding: 0.35rem 0.75rem; border-radius: 6px;
                font-size: 0.825rem; font-weight: 600; white-space: nowrap;
              }
              .action:hover { background: var(--chip-hover); text-decoration: none; }
              .action.download { color: var(--fg); opacity: 0.85; }
              .empty { color: var(--muted); font-style: italic; }
            </style>
          </head>
          <body>
          HEAD

            echo "<h1>Release files for ${REPO}</h1>"
            echo "<p class='subtitle'>Generated $(date -u +'%Y-%m-%d %H:%M UTC') by GitHub Actions. Renderable files (image/video/audio/pdf) open in the browser via a thin wrapper page; other types download.</p>"

            releases=$(gh release list --json tagName,name,publishedAt,isLatest --limit 100)
            count=$(echo "$releases" | jq 'length')

            if [ "$count" = "0" ]; then
              echo "<p class='empty'>No releases yet.</p>"
            else
              echo "$releases" | jq -c '.[]' | while read -r release; do
                tag=$(echo "$release"     | jq -r '.tagName')
                name=$(echo "$release"    | jq -r '.name // .tagName')
                pub=$(echo "$release"     | jq -r '.publishedAt')
                latest=$(echo "$release"  | jq -r '.isLatest')
                pub_short=$(date -u -d "$pub" +'%Y-%m-%d %H:%M UTC' 2>/dev/null || echo "$pub")

                echo "<section class='release'>"
                echo "  <div class='release-head'>"
                echo "    <h2>${name}</h2>"
                [ "$latest" = "true" ] && echo "    <span class='latest-badge'>latest</span>"
                echo "  </div>"
                echo "  <div class='release-meta'>Tag <code>${tag}</code> · ${pub_short}</div>"

                assets_json=$(gh release view "$tag" --json assets -q '.assets[] | {name, size}')
                if [ -z "$assets_json" ]; then
                  echo "  <p class='empty'>No assets.</p>"
                else
                  echo "$assets_json" | jq -c '.' | while read -r a; do
                    asset=$(echo "$a" | jq -r '.name')
                    size=$(echo "$a" | jq -r '.size')
                    mime=$(mime_for "$asset")
                    cat=$(category_for "$asset")
                    rel_url="https://github.com/${REPO}/releases/download/${tag}/${asset}"

                    if [ "$size" -ge 1073741824 ]; then human=$(awk "BEGIN{printf \"%.1f GB\", $size/1073741824}")
                    elif [ "$size" -ge 1048576 ];    then human=$(awk "BEGIN{printf \"%.1f MB\", $size/1048576}")
                    elif [ "$size" -ge 1024 ];       then human=$(awk "BEGIN{printf \"%.1f KB\", $size/1024}")
                    else human="${size} B"; fi

                    if [ "$cat" = "other" ]; then
                      link_url="$rel_url"
                      action_class="action download"
                      action_label="download &darr;"
                    else
                      write_wrapper "$tag" "$asset" "$rel_url" "$cat" "$mime"
                      link_url="./${tag}/${asset}.html"
                      action_class="action"
                      action_label="open &rarr;"
                    fi

                    echo "  <div class='file'>"
                    echo "    <div class='file-main'>"
                    echo "      <div class='filename'>${asset}</div>"
                    echo "      <div class='file-meta'>${mime} · ${human}</div>"
                    echo "    </div>"
                    echo "    <a class='${action_class}' href='${link_url}' target='_blank' rel='noopener'>${action_label}</a>"
                    echo "  </div>"
                  done
                fi

                echo "</section>"
              done
            fi

            echo "</body></html>"
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get OIDC token for Pages
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Find artifact id for github-pages
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const a = data.artifacts.find(x => x.name === 'github-pages');
            if (!a) throw new Error('github-pages artifact not found');
            core.setOutput('id', String(a.id));

      - name: Create Pages deployment with unique build version
        id: deployment
        uses: actions/github-script@v7
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        with:
          script: |
            const crypto = require('crypto');
            const unique = crypto.createHash('sha1')
              .update(`${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${Date.now()}`)
              .digest('hex');
            core.info(`Deploying with pages_build_version=${unique}`);
            const res = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: unique,
              oidc_token: process.env.OIDC_TOKEN,
            });
            core.info(`Deployment created: id=${res.data.id} status_url=${res.data.status_url}`);
            core.setOutput('page_url', res.data.page_url || `https://${context.repo.owner}.github.io/${context.repo.repo}/`);

            // Poll until the deployment reports a terminal state
            const statusUrl = res.data.status_url;
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              await new Promise(r => setTimeout(r, 5000));
              const s = await github.request(statusUrl);
              core.info(`status: ${s.data.status}`);
              if (s.data.status === 'succeed' || s.data.status === 'success') return;
              if (['failed', 'errored', 'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(s.data.status)) {
                throw new Error(`Deployment failed with status: ${s.data.status}`);
              }
            }
            throw new Error('Deployment did not finish within 5 minutes');
